name: Metrics
on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # ponytail: header + contribution calendar only; public repos are too few for language stats to mean anything
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cvinhnguyen
          template: classic
          base: header
          config_timezone: Europe/Helsinki
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
